[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "async-yt-dlp"
version = "0.1.1"
description = "Production-ready, strictly typed async wrapper for yt-dlp"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["yt-dlp", "async", "asyncio", "youtube", "video", "download"]
authors = [
    { name = "async-yt-dlp contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "yt-dlp>=2024.01.01",
]

[project.optional-dependencies]
ffmpeg = [
    "aio-ffmpeg>=0.1.0",
]
full = [
    "aio-ffmpeg>=0.1.0",
    "brotli>=1.0.0",
    "certifi>=2024.01.01",
    "curl-cffi>=0.5.10",
    "deno>=2.0.0",
    "mutagen>=1.47.0",
    "pycryptodomex>=3.20.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "websockets>=13.0",
    "yt-dlp-ejs>=0.8.0",
]
dev = [
    "graphifyy>=0.9.64",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "coverage>=7.6.0",
]

[project.urls]
Homepage = "https://github.com/baton-spb/AsyncYTDLP"
Documentation = "https://github.com/baton-spb/AsyncYTDLP#readme"
Repository = "https://github.com/baton-spb/AsyncYTDLP.git"
Issues = "https://github.com/baton-spb/AsyncYTDLP/issues"

[tool.uv.sources]
aio-ffmpeg = { path = "../AsyncFFmpeg" }

[tool.hatch.build.targets.wheel]
packages = ["src/async_yt_dlp"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
]
ignore = [
    "A005",   # Module shadowing standard library module
    "RET505", # Unnecessary elif after return
    "RUF001", # Ambiguous unicode characters in string (Cyrillic)
    "RUF002", # Ambiguous unicode characters in docstring (Cyrillic)
    "RUF003", # Ambiguous unicode characters in comment (Cyrillic)
    "E501",   # Line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["async_yt_dlp"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "yt_dlp.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests requiring real yt-dlp execution (may be network-dependent)",
    "e2e: end-to-end tests requiring internet connection",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["async_yt_dlp"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@overload",
]
